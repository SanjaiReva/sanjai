<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pick a Day</title>
<style>
  :root{
    --paper:#f6f3ee;
    --ink:#23241f;
    --line:#d8d2c4;
    --accent:#b5562a;
    --accent-soft:#f1e2d6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family: 'Courier New', Consolas, monospace;
    padding:32px 16px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  h1{
    font-size:1.3rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin:0 0 4px 0;
    border-bottom:2px solid var(--ink);
    padding-bottom:10px;
    text-align:center;
  }
  .range{
    font-size:0.85rem;
    color:#6b675c;
    margin-bottom:24px;
    letter-spacing:0.03em;
    text-align:center;
  }
  .grid{
    display:flex;
    flex-wrap:wrap;
    background:#fff;
    border:1px solid var(--line);
    width:100%;
    max-width:760px;
  }
  .col{
    display:flex;
    flex-direction:column;
    flex:1 1 50%;
    border-right:1px solid var(--line);
    min-width:0;
  }
  .col:last-child{
    border-right:none;
  }
  label{
    display:flex;
    align-items:center;
    gap:8px;
    padding:14px 8px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    font-size:0.8rem;
    white-space:nowrap;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  .col label:last-child{
    border-bottom:none;
  }
  label:active{
    background:var(--accent-soft);
  }
  input[type="checkbox"]{
    appearance:none;
    width:18px;
    height:18px;
    border:1.5px solid var(--ink);
    border-radius:4px;
    margin:0;
    position:relative;
    flex-shrink:0;
  }
  input[type="checkbox"]:checked{
    border-color:var(--accent);
    background:var(--accent);
  }
  input[type="checkbox"]:checked::after{
    content:"";
    position:absolute;
    left:5px;
    top:1px;
    width:5px;
    height:9px;
    border:solid #fff;
    border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }
  .daynum{
    font-weight:bold;
  }
  .weekday{
    color:#8b8678;
    font-size:0.68rem;
    text-transform:uppercase;
  }
</style>
</head>
<body>

  <h1>Choose a Date</h1>
  <div class="range">June 20 &ndash; July 20</div>

  <form class="grid">

    <div class="col">
      <label><input type="checkbox" name="d20" checked><span class="weekday">Sat</span><span class="daynum">Jun 20</span></label>
      <label><input type="checkbox" name="d21"><span class="weekday">Sun</span><span class="daynum">Jun 21</span></label>
      <label><input type="checkbox" name="d22"><span class="weekday">Mon</span><span class="daynum">Jun 22</span></label>
      <label><input type="checkbox" name="d23"><span class="weekday">Tue</span><span class="daynum">Jun 23</span></label>
      <label><input type="checkbox" name="d24"><span class="weekday">Wed</span><span class="daynum">Jun 24</span></label>
      <label><input type="checkbox" name="d25"><span class="weekday">Thu</span><span class="daynum">Jun 25</span></label>
      <label><input type="checkbox" name="d26"><span class="weekday">Fri</span><span class="daynum">Jun 26</span></label>
      <label><input type="checkbox" name="d27"><span class="weekday">Sat</span><span class="daynum">Jun 27</span></label>
      <label><input type="checkbox" name="d28"><span class="weekday">Sun</span><span class="daynum">Jun 28</span></label>
      <label><input type="checkbox" name="d29"><span class="weekday">Mon</span><span class="daynum">Jun 29</span></label>
      <label><input type="checkbox" name="d30"><span class="weekday">Tue</span><span class="daynum">Jun 30</span></label>
      <label><input type="checkbox" name="d31"><span class="weekday">Wed</span><span class="daynum">Jul 1</span></label>
      <label><input type="checkbox" name="d32"><span class="weekday">Thu</span><span class="daynum">Jul 2</span></label>
      <label><input type="checkbox" name="d33"><span class="weekday">Fri</span><span class="daynum">Jul 3</span></label>
      <label><input type="checkbox" name="d34"><span class="weekday">Sat</span><span class="daynum">Jul 4</span></label>
      <label><input type="checkbox" name="d35"><span class="weekday">Sun</span><span class="daynum">Jul 5</span></label>
    </div>

    <div class="col">
      <label><input type="checkbox" name="d36"><span class="weekday">Mon</span><span class="daynum">Jul 6</span></label>
      <label><input type="checkbox" name="d37"><span class="weekday">Tue</span><span class="daynum">Jul 7</span></label>
      <label><input type="checkbox" name="d38"><span class="weekday">Wed</span><span class="daynum">Jul 8</span></label>
      <label><input type="checkbox" name="d39"><span class="weekday">Thu</span><span class="daynum">Jul 9</span></label>
      <label><input type="checkbox" name="d40"><span class="weekday">Fri</span><span class="daynum">Jul 10</span></label>
      <label><input type="checkbox" name="d41"><span class="weekday">Sat</span><span class="daynum">Jul 11</span></label>
      <label><input type="checkbox" name="d42"><span class="weekday">Sun</span><span class="daynum">Jul 12</span></label>
      <label><input type="checkbox" name="d43"><span class="weekday">Mon</span><span class="daynum">Jul 13</span></label>
      <label><input type="checkbox" name="d44"><span class="weekday">Tue</span><span class="daynum">Jul 14</span></label>
      <label><input type="checkbox" name="d45"><span class="weekday">Wed</span><span class="daynum">Jul 15</span></label>
      <label><input type="checkbox" name="d46"><span class="weekday">Thu</span><span class="daynum">Jul 16</span></label>
      <label><input type="checkbox" name="d47"><span class="weekday">Fri</span><span class="daynum">Jul 17</span></label>
      <label><input type="checkbox" name="d48"><span class="weekday">Sat</span><span class="daynum">Jul 18</span></label>
      <label><input type="checkbox" name="d49"><span class="weekday">Sun</span><span class="daynum">Jul 19</span></label>
      <label><input type="checkbox" name="d50"><span class="weekday">Mon</span><span class="daynum">Jul 20</span></label>
    </div>

  </form>

</body>
</html>
